<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de dépôt</title>
</head>
<body style="margin: 0; padding: 0;">
    <div th:replace="~{email/fragments/header :: header}"></div>
    
    <h2 style="color: #0f766e; margin-top: 0; font-size: 22px; font-weight: 600;">Dépôt d'espèces confirmé</h2>
    
    <p style="font-size: 16px; color: #374151;">Bonjour <span th:text="${prenom}">Client</span>,</p>
    
    <p style="font-size: 16px; color: #374151; margin-bottom: 24px;">
        Nous vous confirmons que votre dépôt a bien été enregistré avec succès.
    </p>
    
    <div style="background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; margin-bottom: 24px;">
        <table style="width: 100%; border-collapse: collapse;">
            <tbody>
                <tr style="border-bottom: 1px solid #f3f4f6;">
                    <td style="padding: 12px 16px; font-size: 14px; color: #6b7280; width: 40%;">Montant déposé</td>
                    <td style="padding: 12px 16px; font-size: 16px; color: #16a34a; font-weight: 700;" th:text="${'+' + montant + ' FCFA'}">+10,000 FCFA</td>
                </tr>
                <tr style="border-bottom: 1px solid #f3f4f6;">
                    <td style="padding: 12px 16px; font-size: 14px; color: #6b7280;">Numéro de compte</td>
                    <td style="padding: 12px 16px; font-size: 14px; color: #111827; font-family: monospace;" th:text="${numCompte}">1234567890</td>
                </tr>
                <tr>
                    <td style="padding: 12px 16px; font-size: 14px; color: #6b7280;">Nouveau solde disponible</td>
                    <td style="padding: 12px 16px; font-size: 15px; color: #0f766e; font-weight: 700;" th:text="${nouveauSolde + ' FCFA'}">50,000 FCFA</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <p style="font-size: 14px; color: #6b7280; margin-top: 24px;">
        Merci d'utiliser les services de Soutra Core Banking.
    </p>
    
    <div th:replace="~{email/fragments/header :: footer}"></div>
</body>
</html>
