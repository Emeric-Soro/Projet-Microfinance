spring.application.name=soutra-core-banking
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]
spring.profiles.default=dev
# ==========================================
# CONNEXION A LA BASE DE DONNEES ORACLE
# ==========================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@127.0.0.1:1521/SOUTRA_DB}
spring.datasource.username=${DB_USERNAME:soutra_admin}
spring.datasource.password=${DB_PASSWORD:soutra_admin_pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# ==========================================
# CONFIGURATION HIBERNATE (JPA)
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create

# Affiche le SQL genere dans la console pour verifier que l'UML est bien traduit
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Garde l'integration Docker Compose pilotable par l'environnement pour le dev local
# et la desactive par defaut dans les contextes classiques.
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Le cache Spring applicatif reste explicitement sur Caffeine pour les lectures
# fortement sollicitees comme les parametres de tarification.
spring.cache.type=caffeine
spring.cache.cache-names=tarification-parametres
spring.cache.caffeine.spec=maximumSize=${APP_CACHE_TARIFICATION_MAX_ENTRIES:1000},expireAfterWrite=${APP_CACHE_TARIFICATION_TTL:30m},recordStats

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.repair-on-migrate=true

# Downgrade Hibernate SQL exception logging to WARN (constraint violations are handled by GlobalExceptionHandler)
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=WARN
spring.flyway.validate-migration-naming=true
# Evite un echec immediat si Oracle accepte le conteneur avant d'ouvrir totalement la base.
spring.flyway.connect-retries=${SPRING_FLYWAY_CONNECT_RETRIES:24}
spring.flyway.connect-retries-interval=${SPRING_FLYWAY_CONNECT_RETRIES_INTERVAL:5s}
application.security.jwt.secret-key=${JWT_SECRET_KEY:VGhpcy1pcy1kZWZhdWx0LWRldi1zZWNyZXQta2V5LWNoYW5nZS1tZS1mb3ItcHJvZA==}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:3600000}
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.security.jwt.blacklist-store=${APP_JWT_BLACKLIST_STORE:memory}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,flyway}
management.endpoint.health.probes.enabled=true
app.security.rate-limit.cache-max-entries=${APP_RATE_LIMIT_CACHE_MAX_ENTRIES:10000}
app.security.rate-limit.cache-ttl=${APP_RATE_LIMIT_CACHE_TTL:30m}
app.security.rate-limit.client-signup.max-requests=${APP_RATE_LIMIT_CLIENT_SIGNUP_MAX_REQUESTS:5}
app.security.rate-limit.client-signup.window=${APP_RATE_LIMIT_CLIENT_SIGNUP_WINDOW:1m}
app.security.rate-limit.user-signup.max-requests=${APP_RATE_LIMIT_USER_SIGNUP_MAX_REQUESTS:3}
app.security.rate-limit.user-signup.window=${APP_RATE_LIMIT_USER_SIGNUP_WINDOW:1m}
app.security.rate-limit.login.max-requests=${APP_RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
app.security.rate-limit.login.window=${APP_RATE_LIMIT_LOGIN_WINDOW:1m}
app.security.rate-limit.credit-simulation.max-requests=${APP_RATE_LIMIT_CREDIT_SIMULATION_MAX_REQUESTS:20}
app.security.rate-limit.credit-simulation.window=${APP_RATE_LIMIT_CREDIT_SIMULATION_WINDOW:1m}
app.security.rate-limit.auth-recovery.max-requests=${APP_RATE_LIMIT_AUTH_RECOVERY_MAX_REQUESTS:5}
app.security.rate-limit.auth-recovery.window=${APP_RATE_LIMIT_AUTH_RECOVERY_WINDOW:1m}
app.security.auth.max-failed-attempts=${APP_AUTH_MAX_FAILED_ATTEMPTS:5}
app.security.auth.lock-duration=${APP_AUTH_LOCK_DURATION:15m}
app.security.auth.credentials-validity-days=${APP_AUTH_CREDENTIALS_VALIDITY_DAYS:90}
app.security.auth.otp-validity=${APP_AUTH_OTP_VALIDITY:5m}
app.security.auth.otp-length=${APP_AUTH_OTP_LENGTH:6}
app.security.auth.max-otp-attempts=${APP_AUTH_MAX_OTP_ATTEMPTS:3}
app.workflow.transaction.approval-threshold=${APP_TRANSACTION_APPROVAL_THRESHOLD:500000.00}
app.workflow.transaction.max-retrait-guichet=${APP_TRANSACTION_MAX_RETRAIT_GUICHET:1000000.00}
app.demo-data.seed-on-startup=${APP_DEMO_DATA_SEED_ON_STARTUP:true}
# Parametres Systeme
app.system.user.id=1
app.default.currency=XOF
# Parametres Carte VISA
app.carte.plafond-journalier-defaut=500000.00
app.carte.validite-annees=3
# Parametres Batch
app.batch.chunk-size=500

# ==========================================
# PROPRIETES SPECIFIQUES SOUTRA MICROFINANCE
# ==========================================
soutra.reglementation.devise=XOF
soutra.reglementation.seuil-usure-annuel=0.24
soutra.reglementation.seuil-double-validation-xof=500000.00
soutra.integration.wave.api-url=https://api.wave.ci/v1
soutra.integration.wave.api-key=${WAVE_CI_API_KEY:}
soutra.integration.orange-money.api-url=https://api.orange.ci/om/v1
soutra.integration.orange-money.api-key=${OM_CI_API_KEY:}
soutra.integration.mtn-momo.api-url=https://api.mtn.ci/momo/v1
soutra.integration.mtn-momo.api-key=${MTN_CI_API_KEY:}

# Templates SMS
app.sms.template.virement=Vous avez recu un virement de %s FCFA sur le compte %s
app.sms.template.alerte-securite=Alerte securite : une connexion suspecte a ete detectee sur votre espace client.
app.sms.template.otp=Votre code d&#39;authentification est %s. Il expire dans 5 minutes.
app.sms.delivery-mode=${APP_SMS_DELIVERY_MODE:logging}
app.sms.provider=${APP_SMS_PROVIDER:wave}
app.sms.send-path=${APP_SMS_SEND_PATH:/messages}

# ==========================================
# SMTP / EMAIL
# ==========================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@soutra-core-banking.local}
app.mail.delivery-mode=${APP_MAIL_DELIVERY_MODE:logging}

# ==========================================
# PASSWORD RESET
# ==========================================
app.password-reset.token-validity=${APP_PASSWORD_RESET_TOKEN_VALIDITY:30m}
app.password-reset.frontend-base-url=${APP_PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
app.password-reset.reset-path=${APP_PASSWORD_RESET_PATH:/auth/reset}

# ==========================================
# FILE UPLOAD
# ==========================================
app.file.storage-path=${APP_FILE_STORAGE_PATH:./uploads/documents}
spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:10MB}
