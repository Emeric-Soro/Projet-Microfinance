spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.com.soutra.microfinance=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:WARN}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
app.security.jwt.blacklist-store=${APP_JWT_BLACKLIST_STORE:redis}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
app.sms.delivery-mode=${APP_SMS_DELIVERY_MODE:http}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# SMS Production strategy
app.sms.http.connect-timeout=${APP_SMS_HTTP_CONNECT_TIMEOUT:5000}
app.sms.http.read-timeout=${APP_SMS_HTTP_READ_TIMEOUT:10000}
app.sms.retry.max-attempts=${APP_SMS_RETRY_MAX_ATTEMPTS:3}
app.sms.retry.backoff-ms=${APP_SMS_RETRY_BACKOFF_MS:1000}
app.sms.alert.on-failure=${APP_SMS_ALERT_ON_FAILURE:true}
app.sms.alert.threshold=${APP_SMS_ALERT_THRESHOLD:5}
