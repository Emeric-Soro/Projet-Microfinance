<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation Transactions - MicroFinance</title>
  <link rel="stylesheet" href="../assets/css/backoffice.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <div class="topbar-title">Validation des Transactions</div>
            <div class="topbar-breadcrumb">Opérations / Validation 4-eyes</div>
          </div>
        </div>
        <div class="topbar-right">
          <span style="font-size: 12px; color: #4A7A8A;" id="pendingCountHeader">— transactions en attente</span>
          <button class="topbar-icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>
        </div>
      </header>

      <div class="content-area">
        <!-- SUMMARY -->
        <div class="kpi-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 24px;">
          <div class="kpi-card">
            <div class="kpi-icon orange">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="kpi-info">
              <div class="kpi-label">En attente</div>
              <div class="kpi-value" id="pendingCountKpi">—</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="kpi-info">
              <div class="kpi-label">Approuvées (jour)</div>
              <div class="kpi-value">12</div>
            </div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            </div>
            <div class="kpi-info">
              <div class="kpi-label">Rejetées (jour)</div>
              <div class="kpi-value">2</div>
            </div>
          </div>
        </div>

        <!-- PENDING TRANSACTIONS TABLE -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Transactions en attente de validation</div>
          </div>
          <table class="data-table">
            <thead>
              <tr>
                <th>Référence</th>
                <th>Type</th>
                <th>Compte</th>
                <th>Client</th>
                <th>Montant</th>
                <th>Caissier</th>
                <th>Heure</th>
                <th>Motif seuil</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pendingTxnBody">
              <!-- Rempli dynamiquement -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Rejet avec motif -->
  <div class="modal-overlay" id="rejectModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Rejeter la transaction</div>
        <button class="modal-close" onclick="closeModal('rejectModal')"></button>
      </div>
      <div class="modal-body">
        <div style="text-align:center;margin-bottom:16px;">
          <div style="font-family:monospace;font-size:14px;color:#084355;font-weight:700;" id="rejectRef">TXN-2026-00891</div>
        </div>
        <div class="form-group">
          <label class="form-label">Motif du rejet *</label>
          <select class="form-control" id="rejectMotifSelect">
            <option value="">Sélectionner...</option>
            <option value="Suspicion de fraude">Suspicion de fraude</option>
            <option value="Solde insuffisant">Solde insuffisant</option>
            <option value="Document manquant">Document manquant</option>
            <option value="Non-conformité LAB">Non-conformité LAB</option>
            <option value="Autre motif">Autre motif</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Commentaire détaillé *</label>
          <textarea class="form-control" rows="3" placeholder="Précisez la raison du rejet..." id="rejectCommentTextarea"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('rejectModal')">Annuler</button>
        <button class="btn btn-primary" style="background:#D93025;" onclick="executeReject()">Confirmer le rejet</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    let currentRejectRef = '';
    let _txns = [];

    function fmt(n) {
      return Number(n || 0).toLocaleString('fr-FR') + ' FCFA';
    }

    function currentUser() {
      return window.SF ? window.SF.getUser() : null;
    }

    function formatTime(dStr) {
      if (!dStr) return '—';
      try {
        const d = new Date(dStr);
        return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      } catch (_) {
        return dStr;
      }
    }

    async function loadPendingTransactions() {
      const bodyEl = document.getElementById('pendingTxnBody');
      bodyEl.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:#4A7A8A;">Chargement des transactions…</td></tr>';

      try {
        const res = await Transactions.listerEnAttente();
        if (res && res.ok) {
          const page = await res.json();
          _txns = page.content || [];
          renderTransactions(_txns);
        } else {
          bodyEl.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:#c62828;">Erreur lors du chargement des transactions.</td></tr>';
        }
      } catch (e) {
        bodyEl.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;color:#c62828;">Erreur réseau : ' + e.message + '</td></tr>';
      }
    }

    function renderTransactions(list) {
      const bodyEl = document.getElementById('pendingTxnBody');
      const count = list.length;

      document.getElementById('pendingCountHeader').textContent = count + ' transaction' + (count > 1 ? 's' : '') + ' en attente';
      document.getElementById('pendingCountKpi').textContent = count;

      if (!count) {
        bodyEl.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#4A7A8A;">Aucune transaction en attente de validation.</td></tr>';
        return;
      }

      bodyEl.innerHTML = list.map(tx => {
        const typeStr = (tx.typeOperation || 'Opération').toUpperCase();
        const typeClass = typeStr === 'VIREMENT' ? 'badge-info' : 'badge-pending';
        const client = tx.clientNom || '—';
        
        let accountDisplay = tx.compteSource || '—';
        if (tx.compteSource && tx.compteDestination && typeStr === 'VIREMENT') {
          accountDisplay = tx.compteSource + ' ➔ ' + tx.compteDestination;
        } else if (!tx.compteSource && tx.compteDestination) {
          accountDisplay = tx.compteDestination;
        }
        
        const demandeur = tx.demandeurNom || '—';
        const time = formatTime(tx.dateCreation);
        const ref = tx.referenceUnique;
        const limitText = '> 500 000 FCFA';

        return `<tr>
          <td style="font-family:monospace;font-size:12px;color:#084355;">${ref}</td>
          <td><span class="badge ${typeClass}">${typeStr}</span></td>
          <td style="font-family:monospace;font-size:11px;">${accountDisplay}</td>
          <td>${client}</td>
          <td style="font-weight:700;">${fmt(tx.montant)}</td>
          <td style="font-size:12px;">${demandeur}</td>
          <td style="font-size:12px;">${time}</td>
          <td><span class="badge badge-pending">${limitText}</span></td>
          <td>
            <div style="display:flex;gap:6px;">
              <button class="action-icon" title="Approuver" onclick="approveTxn('${ref}')" style="background:rgba(46,125,50,0.15);color:#2E7D32;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button class="action-icon" title="Rejeter" onclick="rejectTxn('${ref}')" style="background:rgba(217,48,37,0.15);color:#D93025;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    async function approveTxn(ref) {
      const user = currentUser();
      if (!user || !user.idUser) {
        showToast('Session expirée.', 'error');
        return;
      }

      if (!confirm('Voulez-vous vraiment approuver la transaction ' + ref + ' ?')) return;

      try {
        const res = await Transactions.approuver(ref, user.idUser);
        if (res && res.status === 200) {
          showToast('Transaction ' + ref + ' approuvée avec succès', 'success');
          await loadPendingTransactions();
        } else {
          const err = await res.json().catch(() => ({}));
          showToast(err.message || 'Erreur lors de l\'approbation.', 'error');
        }
      } catch (e) {
        showToast('Erreur réseau : ' + e.message, 'error');
      }
    }

    function rejectTxn(ref) {
      currentRejectRef = ref;
      document.getElementById('rejectRef').textContent = ref;
      document.getElementById('rejectMotifSelect').value = '';
      document.getElementById('rejectCommentTextarea').value = '';
      openModal('rejectModal');
    }

    async function executeReject() {
      const motif = document.getElementById('rejectMotifSelect').value;
      const comment = document.getElementById('rejectCommentTextarea').value.trim();

      if (!motif) {
        showToast('Veuillez sélectionner un motif.', 'warning');
        return;
      }
      if (!comment) {
        showToast('Veuillez saisir un commentaire détaillé.', 'warning');
        return;
      }

      const user = currentUser();
      if (!user || !user.idUser) {
        showToast('Session expirée.', 'error');
        return;
      }

      closeModal('rejectModal');

      try {
        const fullReason = motif + ' - ' + comment;
        const res = await Transactions.rejeter(currentRejectRef, user.idUser, fullReason);
        if (res && res.status === 200) {
          showToast('Transaction ' + currentRejectRef + ' rejetée', 'warning');
          await loadPendingTransactions();
        } else {
          const err = await res.json().catch(() => ({}));
          showToast(err.message || 'Erreur lors du rejet.', 'error');
        }
      } catch (e) {
        showToast('Erreur réseau : ' + e.message, 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadPendingTransactions);
  </script>
</body>
</html>
