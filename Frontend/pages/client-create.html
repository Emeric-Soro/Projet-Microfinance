<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un client - MicroFinance</title>
  <link rel="stylesheet" href="../assets/css/backoffice.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <div class="topbar-title">Nouveau Client</div>
            <div class="topbar-breadcrumb">Clients / Création</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="topbar-icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>
        </div>
      </header>

      <div class="content-area">
        <div class="card" style="max-width: 720px; margin: 0 auto;">
          <!-- STEPPER -->
          <div class="stepper">
            <div class="step active" data-step="1">
              <div class="step-circle">1</div>
              <span class="step-label">Identité</span>
            </div>
            <div class="step-line"></div>
            <div class="step" data-step="2">
              <div class="step-circle">2</div>
              <span class="step-label">Gouvernemental</span>
            </div>
            <div class="step-line"></div>
            <div class="step" data-step="3">
              <div class="step-circle">3</div>
              <span class="step-label">Physique</span>
            </div>
            <div class="step-line"></div>
            <div class="step" data-step="4">
              <div class="step-circle">4</div>
              <span class="step-label">Économie</span>
            </div>
          </div>

          <form id="clientForm">
            <!-- ÉTAPE 1: Identité -->
            <div class="step-content" id="step1">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #084355;">Informations d'identité</h3>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Nom de famille *</label>
                  <input type="text" class="form-control" placeholder="Ex: Kouamé" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Prénom(s) *</label>
                  <input type="text" class="form-control" placeholder="Ex: Aya Marie" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Sexe *</label>
                <div style="display: flex; gap: 20px; margin-top: 6px;">
                  <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px;">
                    <input type="radio" name="sexe" value="M" style="accent-color: #084355;"> Masculin
                  </label>
                  <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px;">
                    <input type="radio" name="sexe" value="F" style="accent-color: #084355;"> Féminin
                  </label>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Année de naissance *</label>
                  <input type="number" class="form-control" placeholder="Ex: 1990" min="1940" max="2010" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Nationalité *</label>
                  <select class="form-control" required>
                    <option value="">Sélectionner...</option>
                    <option value="CI" selected>Côte d'Ivoire</option>
                    <option value="BF">Burkina Faso</option>
                    <option value="ML">Mali</option>
                    <option value="SN">Sénégal</option>
                    <option value="GN">Guinée</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end; margin-top: 24px;">
                <button type="button" class="btn btn-primary btn-next-step">
                  Suivant
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>

            <!-- ÉTAPE 2: Gouvernemental -->
            <div class="step-content" id="step2" style="display: none;">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #084355;">Pièce d'identité</h3>
              <div class="form-group">
                <label class="form-label">Type de justificatif *</label>
                <select class="form-control" required>
                  <option value="">Sélectionner...</option>
                  <option value="cni">Carte Nationale d'Identité</option>
                  <option value="passeport">Passeport</option>
                  <option value="titre-sejour">Titre de Séjour</option>
                  <option value="permis">Permis de Conduire</option>
                </select>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">N° d'immatriculation *</label>
                  <input type="text" class="form-control" placeholder="Ex: CI-AB-2024-001234" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Date d'émission *</label>
                  <input type="date" class="form-control" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Date de péremption *</label>
                <input type="date" class="form-control" required>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 24px;">
                <button type="button" class="btn btn-outline btn-prev-step">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="15 18 9 12 15 6"/></svg>
                  Précédent
                </button>
                <button type="button" class="btn btn-primary btn-next-step">
                  Suivant
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>

            <!-- ÉTAPE 3: Physique -->
            <div class="step-content" id="step3" style="display: none;">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #084355;">Adresse physique</h3>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Code régional *</label>
                  <select class="form-control" required>
                    <option value="">Sélectionner...</option>
                    <option value="AB">Abidjan</option>
                    <option value="YM">Yamoussoukro</option>
                    <option value="BK">Bouaké</option>
                    <option value="SN">San-Pédro</option>
                    <option value="KR">Korhogo</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Ville / Commune *</label>
                  <input type="text" class="form-control" placeholder="Ex: Cocody" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Voie / Adresse *</label>
                <input type="text" class="form-control" placeholder="Ex: Rue des Jardins, Lot 45" required>
              </div>
              <div class="form-group">
                <label class="form-label">Téléphone mobile *</label>
                <div class="input-group">
                  <span class="input-addon">+225</span>
                  <input type="tel" class="form-control" placeholder="07 08 09 10 11" required>
                </div>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 24px;">
                <button type="button" class="btn btn-outline btn-prev-step">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="15 18 9 12 15 6"/></svg>
                  Précédent
                </button>
                <button type="button" class="btn btn-primary btn-next-step">
                  Suivant
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
              </div>
            </div>

            <!-- ÉTAPE 4: Économie -->
            <div class="step-content" id="step4" style="display: none;">
              <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #084355;">Informations économiques</h3>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Rang salarial</label>
                  <select class="form-control">
                    <option value="">Sélectionner...</option>
                    <option value="1">Moins de 100 000 FCFA</option>
                    <option value="2">100 000 - 300 000 FCFA</option>
                    <option value="3">300 000 - 500 000 FCFA</option>
                    <option value="4">500 000 - 1 000 000 FCFA</option>
                    <option value="5">Plus de 1 000 000 FCFA</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Nature du travail</label>
                  <select class="form-control">
                    <option value="">Sélectionner...</option>
                    <option value="salarie">Salarié</option>
                    <option value="independant">Indépendant</option>
                    <option value="commercant">Commerçant</option>
                    <option value="agriculteur">Agriculteur</option>
                    <option value="fonctionnaire">Fonctionnaire</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Photo du client</label>
                <div class="upload-zone">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <p>Glisser-déposer la photo ici</p>
                  <p class="upload-hint">ou cliquer pour parcourir (JPG, PNG - Max 2Mo)</p>
                  <input type="file" accept="image/*" style="display: none;" id="photoUpload">
                </div>
              </div>
              <div style="display: flex; justify-content: space-between; margin-top: 24px;">
                <button type="button" class="btn btn-outline btn-prev-step">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;"><polyline points="15 18 9 12 15 6"/></svg>
                  Précédent
                </button>
                <button type="submit" class="btn btn-primary btn-lg">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                  Créer le client
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('clientForm').addEventListener('submit', function(e) {
      e.preventDefault();
      showToast('Client créé avec succès !', 'success');
      setTimeout(() => { window.location.href = 'clients.html'; }, 1500);
    });

    document.querySelector('.upload-zone').addEventListener('click', function() {
      document.getElementById('photoUpload').click();
    });
  </script>
</body>
</html>
