<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Crédits Actifs - MicroFinance</title>
        <link rel="stylesheet" href="../assets/css/backoffice.css" />
        <style>
            .status-bar {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 20px;
            }
            .status-tab {
                padding: 6px 14px;
                border-radius: 20px;
                border: 1px solid #c9dfe8;
                background: #fff;
                color: #4a7a8a;
                font-size: 12px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s;
            }
            .status-tab.active {
                background: #084355;
                color: #fff;
                border-color: #084355;
            }
            .status-tab:hover:not(.active) {
                background: #f0f6fa;
            }
            .credit-row {
                cursor: pointer;
                transition: background 0.15s;
            }
            .credit-row:hover td {
                background: #f0f6fa !important;
            }
            .progress-bar-wrap {
                background: #e8f1f5;
                border-radius: 4px;
                height: 6px;
                min-width: 80px;
            }
            .progress-bar-fill {
                background: #084355;
                border-radius: 4px;
                height: 6px;
            }
            .amount-big {
                font-size: 15px;
                font-weight: 700;
                color: #084355;
            }
            .amount-sub {
                font-size: 11px;
                color: #4a7a8a;
            }
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #4a7a8a;
            }
            .empty-state svg {
                opacity: 0.3;
                margin-bottom: 12px;
            }
            .search-filter-row {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
            }
            .search-filter-row input,
            .search-filter-row select {
                flex: 1;
                min-width: 160px;
            }
        </style>
    </head>
    <body>
        <div class="app-layout">
            <aside class="sidebar"></aside>

            <div class="main-content">
                <header class="topbar">
                    <div class="topbar-left">
                        <div>
                            <div class="topbar-title">
                                Portefeuille de Crédits
                            </div>
                            <div class="topbar-breadcrumb">
                                Crédits / Tous les crédits
                            </div>
                        </div>
                    </div>
                    <div class="topbar-right">
                        <a
                            href="credit-simulation.html"
                            class="btn btn-primary btn-sm"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                style="width: 14px; height: 14px"
                            >
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                            Nouvelle demande
                        </a>
                        <button class="topbar-icon-btn">
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
                                />
                                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                            </svg>
                            <span class="notif-dot"></span>
                        </button>
                    </div>
                </header>

                <div class="content-area">
                    <!-- KPI row -->
                    <div
                        class="kpi-grid"
                        style="
                            grid-template-columns: repeat(4, 1fr);
                            margin-bottom: 24px;
                        "
                    >
                        <div class="kpi-card">
                            <div class="kpi-icon blue">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <line x1="12" y1="1" x2="12" y2="23" />
                                    <path
                                        d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
                                    />
                                </svg>
                            </div>
                            <div class="kpi-info">
                                <div class="kpi-label">Total crédits</div>
                                <div class="kpi-value" id="kpiTotal">—</div>
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon green">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M22 11.08V12a10 10 0 1 1-5.93-9.14"
                                    />
                                    <polyline points="22 4 12 14.01 9 11.01" />
                                </svg>
                            </div>
                            <div class="kpi-info">
                                <div class="kpi-label">En cours</div>
                                <div class="kpi-value" id="kpiActif">—</div>
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon orange">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <circle cx="12" cy="12" r="10" />
                                    <line x1="12" y1="8" x2="12" y2="12" />
                                    <line x1="12" y1="16" x2="12.01" y2="16" />
                                </svg>
                            </div>
                            <div class="kpi-info">
                                <div class="kpi-label">En retard</div>
                                <div class="kpi-value" id="kpiRetard">—</div>
                            </div>
                        </div>
                        <div class="kpi-card">
                            <div class="kpi-icon red">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <circle cx="12" cy="12" r="10" />
                                    <line x1="15" y1="9" x2="9" y2="15" />
                                    <line x1="9" y1="9" x2="15" y2="15" />
                                </svg>
                            </div>
                            <div class="kpi-info">
                                <div class="kpi-label">Soldés</div>
                                <div class="kpi-value" id="kpiSoldes">—</div>
                            </div>
                        </div>
                    </div>

                    <!-- Filtres -->
                    <div class="card" style="margin-bottom: 20px">
                        <div class="status-bar">
                            <button
                                class="status-tab active"
                                onclick="setStatut(this, '')"
                            >
                                Tous
                            </button>
                            <button
                                class="status-tab"
                                onclick="setStatut(this, 'EN_COURS')"
                            >
                                En cours
                            </button>
                            <button
                                class="status-tab"
                                onclick="setStatut(this, 'APPROUVE')"
                            >
                                Approuvés
                            </button>
                            <button
                                class="status-tab"
                                onclick="setStatut(this, 'DECAISSE')"
                            >
                                Décaissés
                            </button>
                            <button
                                class="status-tab"
                                onclick="setStatut(this, 'EN_RETARD')"
                            >
                                En retard
                            </button>
                            <button
                                class="status-tab"
                                onclick="setStatut(this, 'SOLDE')"
                            >
                                Soldés
                            </button>
                            <button
                                class="status-tab"
                                onclick="setStatut(this, 'EN_SOUFFRANCE')"
                            >
                                Souffrance
                            </button>
                        </div>
                        <div class="search-filter-row">
                            <input
                                type="text"
                                class="form-control"
                                placeholder="Rechercher par client ou référence..."
                                id="searchInput"
                                oninput="onSearch(this.value)"
                            />
                        </div>
                    </div>

                    <!-- Tableau -->
                    <div class="card">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Référence</th>
                                    <th>Client</th>
                                    <th>Produit</th>
                                    <th>Montant</th>
                                    <th>Remboursé</th>
                                    <th>Avancement</th>
                                    <th>Statut</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="creditsBody">
                                <tr>
                                    <td
                                        colspan="8"
                                        style="
                                            text-align: center;
                                            padding: 32px;
                                            color: #4a7a8a;
                                        "
                                    >
                                        Chargement...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div
                            class="empty-state"
                            id="emptyState"
                            style="display: none"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.5"
                                width="48"
                                height="48"
                            >
                                <line x1="12" y1="1" x2="12" y2="23" />
                                <path
                                    d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"
                                />
                            </svg>
                            <div
                                style="
                                    font-size: 16px;
                                    font-weight: 600;
                                    margin-bottom: 4px;
                                "
                            >
                                Aucun crédit trouvé
                            </div>
                            <div>
                                Modifiez les filtres ou créez une nouvelle
                                demande.
                            </div>
                        </div>
                        <div
                            class="pagination"
                            id="pagination"
                            style="display: none"
                        >
                            <div
                                class="pagination-info"
                                id="paginationInfo"
                            ></div>
                            <div
                                class="pagination-buttons"
                                id="paginationBtns"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="toast-container"></div>
        <script src="../assets/js/app.js"></script>
        <script>
            var currentPage = 0;
            var pageSize = 15;
            var currentStatut = "";
            var currentSearch = "";
            var searchDebounce = null;

            var STATUT_LABELS = {
                EN_COURS: { label: "En cours", cls: "badge-active" },
                APPROUVE: { label: "Approuvé", cls: "badge-info" },
                DECAISSE: { label: "Décaissé", cls: "badge-active" },
                EN_RETARD: { label: "En retard", cls: "badge-pending" },
                SOLDE: { label: "Soldé", cls: "badge-inactive" },
                EN_SOUFFRANCE: { label: "Souffrance", cls: "badge-error" },
                INSTRUCTION: { label: "Instruction", cls: "badge-info" },
                REJETE: { label: "Rejeté", cls: "badge-error" },
            };

            function fmtNum(n) {
                return Number(n || 0).toLocaleString("fr-FR");
            }
            function statutBadge(s) {
                var info = STATUT_LABELS[s] || {
                    label: s || "—",
                    cls: "badge-info",
                };
                return (
                    '<span class="badge ' +
                    info.cls +
                    '">' +
                    info.label +
                    "</span>"
                );
            }

            function setStatut(btn, statut) {
                document.querySelectorAll(".status-tab").forEach(function (el) {
                    el.classList.remove("active");
                });
                btn.classList.add("active");
                currentStatut = statut;
                charger(0);
            }

            function onSearch(val) {
                if (searchDebounce) clearTimeout(searchDebounce);
                searchDebounce = setTimeout(function () {
                    currentSearch = val;
                    charger(0);
                }, 350);
            }

            async function charger(page) {
                currentPage = page;
                document.getElementById("creditsBody").innerHTML =
                    '<tr><td colspan="8" style="text-align:center;padding:32px;color:#4A7A8A;">Chargement...</td></tr>';
                document.getElementById("emptyState").style.display = "none";

                try {
                    var res = await Credits.lister(
                        currentStatut,
                        null,
                        page,
                        pageSize,
                    );
                    if (!res || !res.ok)
                        throw new Error("HTTP " + (res ? res.status : "err"));
                    var data = await res.json();
                    var items = data.content || [];
                    var totalElements = data.totalElements || 0;
                    var totalPages = data.totalPages || 1;

                    // Client-side search filter
                    if (currentSearch) {
                        var q = currentSearch.toLowerCase();
                        items = items.filter(function (c) {
                            return (
                                (c.nomClient || "").toLowerCase().includes(q) ||
                                (c.referenceCredit || "")
                                    .toLowerCase()
                                    .includes(q)
                            );
                        });
                    }

                    var tbody = document.getElementById("creditsBody");
                    if (!items.length) {
                        tbody.innerHTML = "";
                        document.getElementById("emptyState").style.display =
                            "block";
                        document.getElementById("pagination").style.display =
                            "none";
                        return;
                    }
                    document.getElementById("emptyState").style.display =
                        "none";

                    tbody.innerHTML = items
                        .map(function (c) {
                            var montant = c.montantAccorde || 0;
                            var rembourse =
                                montant > 0
                                    ? Math.max(
                                          0,
                                          montant - (c.montantRestantDu || 0),
                                      )
                                    : 0;
                            var pct =
                                montant > 0
                                    ? Math.min(
                                          100,
                                          Math.round(
                                              (rembourse / montant) * 100,
                                          ),
                                      )
                                    : 0;
                            return (
                                '<tr class="credit-row" onclick="voirDetail(' +
                                c.idCredit +
                                ')">' +
                                '<td><strong style="font-family:monospace;color:#084355;font-size:12px;">' +
                                (c.referenceCredit || "CR-" + c.idCredit) +
                                "</strong></td>" +
                                '<td><div style="font-weight:600;">' +
                                (c.nomClient || "") +
                                "</div>" +
                                '<div style="font-size:11px;color:#4A7A8A;">' +
                                (c.codeClient || "") +
                                "</div></td>" +
                                '<td style="font-size:12px;">' +
                                (c.libelleProduit || c.codeProduit || "—") +
                                "</td>" +
                                '<td><div class="amount-big">' +
                                fmtNum(montant) +
                                '</div><div class="amount-sub">FCFA</div></td>' +
                                '<td><div style="font-size:13px;font-weight:600;color:#1A7A4A;">' +
                                fmtNum(rembourse) +
                                '</div><div class="amount-sub">FCFA</div></td>' +
                                '<td><div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:' +
                                pct +
                                '%"></div></div>' +
                                '<div style="font-size:11px;color:#4A7A8A;margin-top:3px;">' +
                                pct +
                                "%</div></td>" +
                                "<td>" +
                                statutBadge(c.statutCredit) +
                                "</td>" +
                                '<td><button class="btn btn-sm btn-outline" style="font-size:11px;padding:3px 8px;" onclick="event.stopPropagation();voirDetail(' +
                                c.idCredit +
                                ')">Voir →</button></td>' +
                                "</tr>"
                            );
                        })
                        .join("");

                    // Pagination
                    var pag = document.getElementById("pagination");
                    var pInfo = document.getElementById("paginationInfo");
                    var pBtns = document.getElementById("paginationBtns");
                    if (totalPages > 1) {
                        pag.style.display = "flex";
                        pInfo.textContent =
                            "Page " +
                            (page + 1) +
                            " / " +
                            totalPages +
                            " (" +
                            totalElements +
                            " crédits)";
                        var btns = "";
                        if (page > 0)
                            btns +=
                                '<button class="page-btn" onclick="charger(' +
                                (page - 1) +
                                ')">‹</button>';
                        for (
                            var i = Math.max(0, page - 2);
                            i < Math.min(totalPages, page + 3);
                            i++
                        ) {
                            btns +=
                                '<button class="page-btn' +
                                (i === page ? " active" : "") +
                                '" onclick="charger(' +
                                i +
                                ')">' +
                                (i + 1) +
                                "</button>";
                        }
                        if (page < totalPages - 1)
                            btns +=
                                '<button class="page-btn" onclick="charger(' +
                                (page + 1) +
                                ')">›</button>';
                        pBtns.innerHTML = btns;
                    } else {
                        pag.style.display = "none";
                    }
                } catch (e) {
                    document.getElementById("creditsBody").innerHTML =
                        '<tr><td colspan="8" style="text-align:center;padding:32px;color:#D93025;">Erreur : ' +
                        e.message +
                        "</td></tr>";
                }
            }

            async function chargerKpis() {
                try {
                    var [rAll, rActif, rRetard, rSolde] = await Promise.all([
                        Credits.lister("", null, 0, 1),
                        Credits.lister("EN_COURS", null, 0, 1),
                        Credits.lister("EN_RETARD", null, 0, 1),
                        Credits.lister("SOLDE", null, 0, 1),
                    ]);
                    if (rAll && rAll.ok) {
                        var d = await rAll.json();
                        document.getElementById("kpiTotal").textContent = (
                            d.totalElements || 0
                        ).toLocaleString("fr-FR");
                    }
                    if (rActif && rActif.ok) {
                        var d2 = await rActif.json();
                        document.getElementById("kpiActif").textContent = (
                            d2.totalElements || 0
                        ).toLocaleString("fr-FR");
                    }
                    if (rRetard && rRetard.ok) {
                        var d3 = await rRetard.json();
                        document.getElementById("kpiRetard").textContent = (
                            d3.totalElements || 0
                        ).toLocaleString("fr-FR");
                    }
                    if (rSolde && rSolde.ok) {
                        var d4 = await rSolde.json();
                        document.getElementById("kpiSoldes").textContent = (
                            d4.totalElements || 0
                        ).toLocaleString("fr-FR");
                    }
                } catch (e) {
                    console.warn("KPIs:", e);
                }
            }

            function voirDetail(idCredit) {
                sessionStorage.setItem("sf_credit_id", String(idCredit));
                window.location.href = "credit-detail.html?id=" + idCredit;
            }

            charger(0);
            chargerKpis();
        </script>
    </body>
</html>
