<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique des frais - MicroFinance</title>
  <link rel="stylesheet" href="../assets/css/backoffice.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <div class="topbar-title">Historique des frais</div>
            <div class="topbar-breadcrumb">Paramétrage / Historique frais</div>
          </div>
        </div>
        <div class="topbar-right">
          <span id="countBadge" style="font-size:12px;color:#4A7A8A;"></span>
          <button class="topbar-icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>
        </div>
      </header>

      <div class="content-area">
        <!-- SUMMARY CARDS -->
        <div class="grid-3-equal" style="margin-bottom: 20px;">
          <div class="card" style="text-align: center;">
            <div style="font-size: 11px; color: #4A7A8A; margin-bottom: 4px;">Total modifications</div>
            <div style="font-size: 28px; font-weight: 800; color: #084355;" id="statTotal">0</div>
          </div>
          <div class="card" style="text-align: center;">
            <div style="font-size: 11px; color: #4A7A8A; margin-bottom: 4px;">Ce mois</div>
            <div style="font-size: 28px; font-weight: 800; color: #2E7D32;" id="statMois">0</div>
          </div>
          <div class="card" style="text-align: center;">
            <div style="font-size: 11px; color: #4A7A8A; margin-bottom: 4px;">Dernière modification</div>
            <div style="font-size: 16px; font-weight: 700; color: #084355;" id="statDerniere">---</div>
          </div>
        </div>

        <!-- FILTERS -->
        <div class="card" style="margin-bottom: 20px; padding: 16px 20px;">
          <div style="display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
            <div>
              <label style="font-size: 11px; font-weight: 600; color: #4A7A8A; display: block; margin-bottom: 4px;">Date début</label>
              <input type="date" class="form-control" id="fDateDeb" style="width: 160px;">
            </div>
            <div>
              <label style="font-size: 11px; font-weight: 600; color: #4A7A8A; display: block; margin-bottom: 4px;">Date fin</label>
              <input type="date" class="form-control" id="fDateFin" style="width: 160px;">
            </div>
            <div>
              <label style="font-size: 11px; font-weight: 600; color: #4A7A8A; display: block; margin-bottom: 4px;">Modifié par</label>
              <input type="text" class="form-control" id="fUser" placeholder="Nom de l'utilisateur..." style="width: 180px;">
            </div>
            <div>
              <label style="font-size: 11px; font-weight: 600; color: #4A7A8A; display: block; margin-bottom: 4px;">Catégorie</label>
              <select class="form-control" id="fCategorie" style="width: 170px;">
                <option value="">Toutes catégories</option>
                <option value="COMMISSION">Commission</option>
                <option value="FRAIS">Frais</option>
                <option value="PENALITE">Pénalité</option>
                <option value="AGIOS">Agios</option>
              </select>
            </div>
            <div style="display: flex; gap: 8px; align-self: flex-end;">
              <button class="btn btn-primary btn-sm" onclick="appliquerFiltres()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Filtrer
              </button>
              <button class="btn btn-outline btn-sm" onclick="reinitialiserFiltres()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                Réinitialiser
              </button>
            </div>
          </div>
        </div>

        <!-- EXPORT + COUNT ROW -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div style="font-size: 13px; color: #4A7A8A;" id="filterInfo">Affichage de toutes les modifications</div>
          <div class="export-buttons" style="display: flex; gap: 8px;">
            <button class="btn btn-outline btn-sm" onclick="exportCSV()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Export CSV
            </button>
            <button class="btn btn-outline btn-sm" onclick="exportPDF()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              Export PDF
            </button>
          </div>
        </div>

        <!-- TABLE -->
        <div class="card">
          <table class="data-table">
            <thead>
              <tr>
                <th style="width:160px;">Date</th>
                <th>Paramètre</th>
                <th>Ancienne valeur</th>
                <th>Nouvelle valeur</th>
                <th style="width:150px;">Modifié par</th>
                <th>Motif</th>
              </tr>
            </thead>
            <tbody id="histTableBody">
              <tr><td colspan="6" style="text-align:center;padding:32px;color:#4A7A8A;">Chargement de l'historique...</td></tr>
            </tbody>
          </table>

          <!-- PAGINATION -->
          <div class="pagination" id="paginationContainer" style="display:none;">
            <div class="pagination-info" id="paginationInfo"></div>
            <div class="pagination-buttons" id="paginationButtons"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    (function () {
      'use strict';

      var allHistory = [];
      var filteredHistory = [];
      var PAGE_SIZE = 15;
      var currentPage = 0;

      /* ── Formatters ─────────────────────────────── */

      function formatCurrency(n) {
        return (n || 0).toLocaleString('fr-FR') + ' FCFA';
      }

      function formatDate(d) {
        if (!d) return '---';
        var dt = new Date(d);
        return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' })
          + ' ' + dt.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      }

      /* ── Summary stats ──────────────────────────── */

      function updateStats() {
        document.getElementById('statTotal').textContent = allHistory.length.toLocaleString('fr-FR');

        var now = new Date();
        var startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        var thisMonth = allHistory.filter(function (h) { return new Date(h.dateModification) >= startOfMonth; });
        document.getElementById('statMois').textContent = thisMonth.length.toLocaleString('fr-FR');

        if (allHistory.length > 0) {
          var sorted = allHistory.slice().sort(function (a, b) { return new Date(b.dateModification) - new Date(a.dateModification); });
          document.getElementById('statDerniere').textContent = formatDate(sorted[0].dateModification);
        }
      }

      /* ── Filter info label ──────────────────────── */

      function updateFilterInfo() {
        var total = allHistory.length;
        var shown = filteredHistory.length;
        var el = document.getElementById('filterInfo');
        if (shown === total) {
          el.textContent = 'Affichage de toutes les modifications (' + total + ')';
        } else {
          el.textContent = 'Affichage de ' + shown + ' modification(s) sur ' + total;
        }
        document.getElementById('countBadge').textContent = shown + ' / ' + total;
      }

      /* ── Pagination ─────────────────────────────── */

      function getTotalPages() {
        return Math.max(1, Math.ceil(filteredHistory.length / PAGE_SIZE));
      }

      function getPageData() {
        var start = currentPage * PAGE_SIZE;
        return filteredHistory.slice(start, start + PAGE_SIZE);
      }

      function renderPagination() {
        var totalPages = getTotalPages();
        var container = document.getElementById('paginationContainer');
        if (filteredHistory.length <= PAGE_SIZE) {
          container.style.display = 'none';
          return;
        }
        container.style.display = 'flex';

        var total = filteredHistory.length;
        var start = currentPage * PAGE_SIZE + 1;
        var end = Math.min((currentPage + 1) * PAGE_SIZE, total);
        document.getElementById('paginationInfo').textContent = 'Affichage ' + start + '-' + end + ' sur ' + total + ' modifications';

        var buttonsEl = document.getElementById('paginationButtons');
        var html = '';
        html += '<button class="page-btn" ' + (currentPage === 0 ? 'disabled' : '') + ' onclick="window._histPage(' + (currentPage - 1) + ')">&lsaquo;</button>';
        for (var i = 0; i < totalPages; i++) {
          if (i === 0 || i === totalPages - 1 || Math.abs(i - currentPage) <= 1) {
            html += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="window._histPage(' + i + ')">' + (i + 1) + '</button>';
          } else if (i === 1 || i === totalPages - 2) {
            html += '<span style="padding:0 4px;color:#4A7A8A;">...</span>';
          }
        }
        html += '<button class="page-btn" ' + (currentPage >= totalPages - 1 ? 'disabled' : '') + ' onclick="window._histPage(' + (currentPage + 1) + ')">&rsaquo;</button>';
        buttonsEl.innerHTML = html;
      }

      window._histPage = function (p) {
        currentPage = p;
        renderTable(getPageData());
        renderPagination();
      };

      /* ── Table rendering ────────────────────────── */

      function renderTable(data) {
        var tbody = document.getElementById('histTableBody');
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:32px;color:#4A7A8A;">Aucun historique trouvé.</td></tr>';
          return;
        }
        var html = '';
        for (var i = 0; i < data.length; i++) {
          var h = data[i];
          var categorie = h.categorie || '';
          var badgeClass = 'badge-info';
          if (categorie === 'COMMISSION') badgeClass = 'badge-pending';
          else if (categorie === 'PENALITE') badgeClass = 'badge-danger';
          else if (categorie === 'AGIOS') badgeClass = 'badge-blocked';
          else if (categorie === 'FRAIS') badgeClass = 'badge-info';

          html += '<tr>';
          html += '<td style="font-size:12px;white-space:nowrap;">' + formatDate(h.dateModification) + '</td>';
          html += '<td>';
          if (categorie) html += '<span class="badge ' + badgeClass + '" style="margin-right:6px;font-size:10px;">' + categorie + '</span>';
          html += (h.parametre || '---') + '</td>';
          html += '<td style="font-family:monospace;font-size:12px;">' + (h.ancienneValeur || '---') + '</td>';
          html += '<td style="font-family:monospace;font-size:12px;font-weight:600;color:#2E7D32;">' + (h.nouvelleValeur || '---') + '</td>';
          html += '<td style="font-size:12px;">' + (h.modifiePar || '---') + '</td>';
          html += '<td style="font-size:12px;color:#4A7A8A;">' + (h.motif || '---') + '</td>';
          html += '</tr>';
        }
        tbody.innerHTML = html;
      }

      /* ── Filters ────────────────────────────────── */

      function appliquerFiltres() {
        var dDeb = document.getElementById('fDateDeb').value;
        var dFin = document.getElementById('fDateFin').value;
        var user = document.getElementById('fUser').value.toLowerCase().trim();
        var cat = document.getElementById('fCategorie').value;

        filteredHistory = allHistory.filter(function (h) {
          if (dDeb && new Date(h.dateModification) < new Date(dDeb)) return false;
          if (dFin && new Date(h.dateModification) > new Date(dFin + 'T23:59:59')) return false;
          if (user && (h.modifiePar || '').toLowerCase().indexOf(user) === -1) return false;
          if (cat && h.categorie !== cat) return false;
          return true;
        });

        currentPage = 0;
        updateFilterInfo();
        renderTable(getPageData());
        renderPagination();
      }
      window.appliquerFiltres = appliquerFiltres;

      function reinitialiserFiltres() {
        document.getElementById('fDateDeb').value = '';
        document.getElementById('fDateFin').value = '';
        document.getElementById('fUser').value = '';
        document.getElementById('fCategorie').value = '';
        filteredHistory = allHistory.slice();
        currentPage = 0;
        updateFilterInfo();
        renderTable(getPageData());
        renderPagination();
        showToast('Filtres réinitialisés.', 'info');
      }
      window.reinitialiserFiltres = reinitialiserFiltres;

      /* ── CSV Export ─────────────────────────────── */

      function exportCSV() {
        var data = filteredHistory.length ? filteredHistory : allHistory;
        if (!data.length) {
          showToast('Aucune donnée à exporter.', 'warning');
          return;
        }
        var headers = ['Date', 'Catégorie', 'Paramètre', 'Ancienne valeur', 'Nouvelle valeur', 'Modifié par', 'Motif'];
        var rows = data.map(function (h) {
          return [
            '"' + formatDate(h.dateModification) + '"',
            '"' + (h.categorie || '') + '"',
            '"' + (h.parametre || '') + '"',
            '"' + (h.ancienneValeur || '') + '"',
            '"' + (h.nouvelleValeur || '') + '"',
            '"' + (h.modifiePar || '') + '"',
            '"' + (h.motif || '') + '"'
          ].join(';');
        });
        var csv = headers.join(';') + '\n' + rows.join('\n');
        var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'historique-frais-' + new Date().toISOString().slice(0, 10) + '.csv';
        a.click();
        showToast('Export CSV téléchargé (' + data.length + ' lignes).', 'success');
      }
      window.exportCSV = exportCSV;

      /* ── PDF Export ─────────────────────────────── */

      function exportPDF() {
        // Endpoint backend inexistant (cf. note dans loadData)
        showToast('Export PDF non disponible : aucun endpoint d\'historique des tarifications.', 'warning');
        return;
        // SF.downloadFile('/api/v1/tarification/historique/export?format=PDF', 'historique_frais_export.pdf');
      }
      window.exportPDF = exportPDF;

      /* ── Data loading ───────────────────────────── */

      async function loadData() {
        // NOTE : Le backend n'expose PAS d'endpoint d'historique des
        // tarifications. Aucun GET /api/v1/tarification/historique n'est
        // declare dans le catalogue d'endpoints. On affiche un message
        // clair a l'utilisateur plutot que de faire un appel qui renverrait
        // indefectiblement un 404.
        document.getElementById('histTableBody').innerHTML =
          '<tr><td colspan="6" style="text-align:center;padding:32px;color:#4A7A8A;">' +
          'Fonctionnalité non disponible : l\'API backend n\'expose pas d\'endpoint d\'historique des tarifications.<br>' +
          '<small>Endpoint attendu (inexistant) : GET /api/v1/tarification/historique</small></td></tr>';
        document.getElementById('countBadge').textContent = '0 modifications';
        allHistory = [];
        filteredHistory = [];
        updateStats();
        updateFilterInfo();
        // Ancien code (endpoint inexistant) :
        //   var res = await SF.apiFetch('/api/v1/tarification/historique');
        //   ...gestion 403, erreur serveur, parsing du tableau...
      }

      document.addEventListener('DOMContentLoaded', loadData);
    })();
  </script>
</body>
</html>
