<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agences - MicroFinance</title>
  <link rel="stylesheet" href="../assets/css/backoffice.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div>
            <div class="topbar-title">Gestion des Agences</div>
            <div class="topbar-breadcrumb">Paramétrage / Agences</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" onclick="ouvrirCreerModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nouvelle agence
          </button>
          <button class="topbar-icon-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot"></span>
          </button>
        </div>
      </header>

      <div class="content-area">
        <div class="card">
          <table class="data-table">
            <thead>
              <tr>
                <th>Code</th>
                <th>Nom de l'agence</th>
                <th>Adresse</th>
                <th>Responsable</th>
                <th>Caissiers</th>
                <th>Clients</th>
                <th>Statut</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="agencesTableBody">
              <tr>
                <td colspan="8" style="text-align:center;">Chargement en cours...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Nouvelle/Modifier agence -->
  <div class="modal-overlay" id="agencyModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="agencyModalTitle">Créer une agence</div>
        <button class="modal-close" onclick="closeModal('agencyModal')"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="agencyId">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Code agence *</label>
            <input type="text" class="form-control" id="agencyCode" placeholder="Ex: AGC-005" required>
          </div>
          <div class="form-group">
            <label class="form-label">Nom de l'agence *</label>
            <input type="text" class="form-control" id="agencyNom" placeholder="Ex: Agence Marcory" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Adresse *</label>
          <input type="text" class="form-control" id="agencyAdresse" placeholder="Adresse complète" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Téléphone</label>
            <input type="text" class="form-control" id="agencyTelephone" placeholder="+225 27 00 00 00 00">
          </div>
          <div class="form-group">
            <label class="form-label">Email professionnel</label>
            <input type="email" class="form-control" id="agencyEmail" placeholder="contact.agence@soutra.local">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('agencyModal')">Annuler</button>
        <button class="btn btn-primary" id="btnSaveAgency" onclick="enregistrerAgence()">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Modal: Désactivation -->
  <div class="modal-overlay" id="deactivateModal">
    <div class="modal" style="max-width:440px;">
      <div class="modal-header">
        <div class="modal-title">Désactiver l'agence</div>
        <button class="modal-close" onclick="closeModal('deactivateModal')"></button>
      </div>
      <div class="modal-body" style="text-align:center;">
        <input type="hidden" id="deactivateAgencyId">
        <div style="width:64px;height:64px;border-radius:50%;background:rgba(250,180,130,0.2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E65100" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;">Confirmer la désactivation ?</h3>
        <p style="color:#4A7A8A;font-size:13px;margin-bottom:16px;">Cela bloquera toutes les opérations de cette agence.</p>
        <div class="form-group" style="text-align:left;">
          <label class="form-label">Motif de désactivation *</label>
          <textarea class="form-control" id="deactivateMotif" rows="2" placeholder="Raison..." required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('deactivateModal')">Annuler</button>
        <button class="btn btn-primary" style="background:#E65100;" onclick="confirmerDesactivation()">Confirmer la désactivation</button>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>
  <script src="../assets/js/app.js"></script>

  <script>
    let allAgences = [];

    document.addEventListener('DOMContentLoaded', () => {
      chargerAgences();
    });

    async function chargerAgences() {
      const tbody = document.getElementById('agencesTableBody');
      if (!tbody) return;
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Chargement en cours...</td></tr>';
      
      try {
        const res = await Agences.lister(0, 100);
        if (res && res.ok) {
          const data = await res.json();
          allAgences = data.content || [];
          renderAgences(allAgences);
        } else {
          tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:red;">Erreur de chargement des agences</td></tr>';
        }
      } catch (err) {
        console.error('Erreur:', err);
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:red;">Erreur de connexion au serveur</td></tr>';
      }
    }

    function renderAgences(agences) {
      const tbody = document.getElementById('agencesTableBody');
      if (!tbody) return;

      if (agences.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Aucune agence trouvée</td></tr>';
        return;
      }

      tbody.innerHTML = agences.map(a => {
        const statusBadge = a.estActive 
          ? '<span class="badge badge-active">Actif</span>' 
          : '<span class="badge badge-blocked">Inactif</span>';
        
        const deactivateBtn = a.estActive 
          ? `<button class="action-icon" title="Désactiver" onclick="ouvrirDesactiverModal(${a.idAgence})" style="background:rgba(217,48,37,0.15);color:#D93025;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></button>`
          : '';

        return `
          <tr>
            <td style="font-family:monospace;font-size:12px;">${a.codeAgence}</td>
            <td style="font-weight:600;">${a.nom}</td>
            <td style="font-size:12px;">${a.adresse || '—'}</td>
            <td>—</td>
            <td><span class="badge badge-info">—</span></td>
            <td>—</td>
            <td>${statusBadge}</td>
            <td>
              <div class="action-icons">
                <button class="action-icon" title="Modifier" onclick="ouvrirModifierModal(${a.idAgence})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                ${deactivateBtn}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function ouvrirCreerModal() {
      document.getElementById('agencyId').value = '';
      document.getElementById('agencyModalTitle').textContent = 'Créer une agence';
      document.getElementById('agencyCode').value = '';
      document.getElementById('agencyCode').disabled = false;
      document.getElementById('agencyNom').value = '';
      document.getElementById('agencyAdresse').value = '';
      document.getElementById('agencyTelephone').value = '';
      document.getElementById('agencyEmail').value = '';
      openModal('agencyModal');
    }

    function ouvrirModifierModal(id) {
      const a = allAgences.find(item => item.idAgence === id);
      if (!a) return;

      document.getElementById('agencyId').value = a.idAgence;
      document.getElementById('agencyModalTitle').textContent = 'Modifier l\'agence';
      document.getElementById('agencyCode').value = a.codeAgence;
      document.getElementById('agencyCode').disabled = true;
      document.getElementById('agencyNom').value = a.nom;
      document.getElementById('agencyAdresse').value = a.adresse || '';
      document.getElementById('agencyTelephone').value = a.telephone || '';
      document.getElementById('agencyEmail').value = '';
      openModal('agencyModal');
    }

    async function enregistrerAgence() {
      const id = document.getElementById('agencyId').value;
      const code = document.getElementById('agencyCode').value.trim();
      const nom = document.getElementById('agencyNom').value.trim();
      const adresse = document.getElementById('agencyAdresse').value.trim();
      const telephone = document.getElementById('agencyTelephone').value.trim();
      const email = document.getElementById('agencyEmail').value.trim();

      if (!code || !nom || !adresse) {
        showToast('Veuillez remplir les champs obligatoires.', 'warning');
        return;
      }

      const payload = {
        codeAgence: code,
        nom: nom,
        adresse: adresse,
        telephone: telephone || null,
        email: email || null
      };

      const btn = document.getElementById('btnSaveAgency');
      const originalText = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      try {
        let res;
        if (id) {
          res = await Agences.modifier(id, payload);
        } else {
          res = await Agences.creer(payload);
        }

        if (res && res.ok) {
          showToast(id ? 'Agence modifiée avec succès !' : 'Agence créée avec succès !', 'success');
          closeModal('agencyModal');
          chargerAgences();
        } else if (res) {
          const data = await res.json().catch(() => ({}));
          showToast(data.message || 'Une erreur est survenue.', 'error');
        }
      } catch (err) {
        showToast('Erreur de connexion au serveur.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function ouvrirDesactiverModal(id) {
      document.getElementById('deactivateAgencyId').value = id;
      document.getElementById('deactivateMotif').value = '';
      openModal('deactivateModal');
    }

    async function confirmerDesactivation() {
      const id = document.getElementById('deactivateAgencyId').value;
      const motif = document.getElementById('deactivateMotif').value.trim();

      if (!motif) {
        showToast('Le motif de désactivation est obligatoire.', 'warning');
        return;
      }

      try {
        const res = await Agences.desactiver(id);
        if (res && res.ok) {
          showToast('Agence désactivée avec succès !', 'success');
          closeModal('deactivateModal');
          chargerAgences();
        } else if (res) {
          const data = await res.json().catch(() => ({}));
          showToast(data.message || 'Impossible de désactiver l\'agence.', 'error');
        }
      } catch (err) {
        showToast('Erreur de connexion au serveur.', 'error');
      }
    }
  </script>
</body>
</html>
